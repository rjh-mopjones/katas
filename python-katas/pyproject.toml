# python-katas — pytest + ruff config. The reference suite lives under solution/; practice/ ships no
# tests (writing them is the exercise).
[tool.pytest.ini_options]
testpaths = ["solution"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
